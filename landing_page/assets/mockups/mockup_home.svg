<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <clipPath id="screen"><rect x="14" y="14" width="362" height="816" rx="46"/></clipPath>
    <linearGradient id="radar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9900"/>
      <stop offset="1" stop-color="#B36B00"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9900" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF9900" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Device body -->
  <rect x="6" y="6" width="378" height="832" rx="54" fill="#05070C" stroke="#232B3A" stroke-width="2"/>
  <rect x="14" y="14" width="362" height="816" rx="46" fill="#0B0F17"/>

  <g clip-path="url(#screen)">
    <!-- Status bar -->
    <text x="42" y="46" fill="#F8FAFC" font-size="13" font-weight="700">9:41</text>
    <g fill="#F8FAFC">
      <rect x="300" y="37" width="16" height="10" rx="2" opacity="0.9"/>
      <rect x="320" y="37" width="16" height="10" rx="2" opacity="0.9"/>
      <rect x="340" y="35" width="22" height="12" rx="3" opacity="0.5"/>
      <rect x="342" y="37" width="16" height="8" rx="1.5"/>
    </g>

    <!-- Header -->
    <text x="28" y="88" fill="#F8FAFC" font-size="22" font-weight="800">⚡ StreamSnap</text>
    <text x="28" y="108" fill="#64748B" font-size="12">Shop anything you see live</text>
    <text x="344" y="94" font-size="20">⚙️</text>

    <!-- Hero: Live Scan radar button -->
    <circle cx="195" cy="240" r="118" fill="url(#radarGlow)"/>
    <circle cx="195" cy="240" r="86" fill="none" stroke="#1E2533" stroke-width="1"/>
    <circle cx="195" cy="240" r="70" fill="#111827" stroke="url(#radar)" stroke-width="3"/>
    <circle cx="195" cy="240" r="70" fill="none" stroke="#FF9900" stroke-width="3" stroke-dasharray="30 300" stroke-linecap="round" transform="rotate(-90 195 240)"/>
    <text x="195" y="234" font-size="34" text-anchor="middle">📡</text>
    <text x="195" y="266" fill="#FF9900" font-size="15" font-weight="800" text-anchor="middle">Live Scan</text>

    <text x="195" y="346" fill="#64748B" font-size="12.5" text-anchor="middle">Start once, then open TikTok or YouTube.</text>
    <text x="195" y="364" fill="#64748B" font-size="12.5" text-anchor="middle">StreamSnap scans in the background.</text>

    <!-- Secondary buttons -->
    <rect x="70" y="386" width="250" height="42" rx="12" fill="#1E2533" stroke="#334155"/>
    <text x="195" y="412" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">📷  Camera snap</text>
    <rect x="70" y="436" width="250" height="42" rx="12" fill="#1E2533" stroke="#334155"/>
    <text x="195" y="462" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle">🖼  Scan from Gallery</text>

    <!-- How it works card -->
    <rect x="24" y="500" width="342" height="118" rx="16" fill="#111827" stroke="#1E2533"/>
    <text x="42" y="528" fill="#F8FAFC" font-size="15" font-weight="700">How live scan works</text>
    <g text-anchor="middle">
      <text x="86" y="566" font-size="22">📡</text>
      <text x="86" y="592" fill="#94A3B8" font-size="9.5">Tap Live Scan</text>
      <text x="195" y="566" font-size="22">📱</text>
      <text x="195" y="592" fill="#94A3B8" font-size="9.5">Open TikTok / YT</text>
      <text x="304" y="566" font-size="22">🛒</text>
      <text x="304" y="592" fill="#94A3B8" font-size="9.5">Finds stack up</text>
      <text x="140" y="568" fill="#334155" font-size="16">→</text>
      <text x="250" y="568" fill="#334155" font-size="16">→</text>
    </g>

    <!-- Recent finds -->
    <text x="24" y="656" fill="#F8FAFC" font-size="16" font-weight="700">Recent Finds</text>
    <text x="366" y="656" fill="#6366F1" font-size="12" text-anchor="end">See all (12)</text>

    <!-- Product card 1 -->
    <rect x="24" y="672" width="342" height="72" rx="14" fill="#172030" stroke="#1E2533"/>
    <rect x="34" y="682" width="52" height="52" rx="10" fill="#0B0F17" stroke="#FF9900" stroke-opacity="0.3"/>
    <text x="60" y="714" font-size="22" text-anchor="middle">🎧</text>
    <text x="98" y="698" fill="#F8FAFC" font-size="12.5" font-weight="700">Sony WH-1000XM5 Headphones</text>
    <text x="98" y="717" fill="#FF9900" font-size="13" font-weight="800">$328.00</text>
    <rect x="176" y="705" width="66" height="16" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="209" y="717" fill="#10B981" font-size="9" font-weight="700" text-anchor="middle">Verified</text>
    <rect x="292" y="696" width="64" height="30" rx="9" fill="#FF9900"/>
    <text x="324" y="716" fill="#0B0F17" font-size="12" font-weight="800" text-anchor="middle">Buy</text>

    <!-- Product card 2 (peek) -->
    <rect x="24" y="752" width="342" height="72" rx="14" fill="#172030" stroke="#1E2533"/>
    <rect x="34" y="762" width="52" height="52" rx="10" fill="#0B0F17" stroke="#FF9900" stroke-opacity="0.3"/>
    <text x="60" y="794" font-size="22" text-anchor="middle">👟</text>
    <text x="98" y="778" fill="#F8FAFC" font-size="12.5" font-weight="700">Nike Air Force 1 '07</text>
    <text x="98" y="797" fill="#FF9900" font-size="13" font-weight="800">$114.99</text>
    <rect x="292" y="776" width="64" height="30" rx="9" fill="#FF9900"/>
    <text x="324" y="796" fill="#0B0F17" font-size="12" font-weight="800" text-anchor="middle">Buy</text>
  </g>

  <!-- Notch -->
  <rect x="150" y="20" width="90" height="26" rx="13" fill="#05070C"/>
</svg>
