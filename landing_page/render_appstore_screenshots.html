<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamSnap App Store Screenshot Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #080C14;
      color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Fixed reference stage: 1290 x 2796 */
    #stage-scaler {
      width: 1290px;
      height: 2796px;
      position: absolute;
      transform-origin: center center;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      background: #080C14;
    }

    /* Ambient luxury glow */
    .ambient-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 1100px;
      background: radial-gradient(ellipse at 50% 10%, rgba(255, 85, 0, 0.32) 0%, rgba(8, 12, 20, 0) 72%);
      pointer-events: none;
      z-index: 1;
    }

    .grid-lines {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 70px 70px;
      pointer-events: none;
    }

    /* Top Editorial Header */
    .header-zone {
      width: 100%;
      text-align: center;
      padding: 90px 60px 30px;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 85, 0, 0.16);
      border: 2.5px solid rgba(255, 106, 0, 0.55);
      padding: 10px 30px;
      border-radius: 999px;
      color: #FF8800;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .headline {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: 94px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.05;
      color: #FFFFFF;
      margin-bottom: 18px;
      max-width: 1180px;
    }

    .headline span.highlight {
      background: linear-gradient(135deg, #FF6A00 0%, #FFA033 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subheadline {
      font-size: 38px;
      line-height: 1.35;
      color: #94A3B8;
      font-weight: 500;
      max-width: 1140px;
    }

    /* Immersive Phone Chassis: Perfectly anchored to bottom edge */
    .phone-container {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 1150px;
      height: 2260px;
      background: #080C14;
      border-top-left-radius: 96px;
      border-top-right-radius: 96px;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border: 16px solid #232B3A;
      box-shadow: 
        0 -20px 80px rgba(0, 0, 0, 0.8),
        0 0 100px rgba(255, 85, 0, 0.35);
      overflow: hidden;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    /* iPhone Top Island & Status Bar */
    .ios-statusbar {
      height: 120px;
      padding: 34px 64px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 50;
      flex-shrink: 0;
    }

    .ios-time {
      font-size: 36px;
      font-weight: 800;
      color: #F8FAFC;
    }

    .dynamic-island {
      width: 300px;
      height: 58px;
      background: #000;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border: 1.5px solid rgba(255, 85, 0, 0.45);
      box-shadow: 0 4px 16px rgba(0,0,0,0.8);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 26px;
    }

    .ios-icons {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 28px;
      color: #F8FAFC;
    }

    /* App Internal Screens */
    .screen-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* =========================================================================
       SCREEN 1: LIVE SCAN RADAR (HOME)
       ========================================================================= */

      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 52px 20px;
      flex-shrink: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-icon {
      width: 74px;
      height: 74px;
      border-radius: 22px;

    .hero-radar-box {

    .big-radar-btn {

      height: 290px;
      border-radius: 50%;
      background: radial-gradient(circle, #FF5500 0%, #D94400 100%);
      box-shadow:

    .big-radar-btn .ico {
      font-size: 74px;

    }

    .big-radar-btn .lbl {
      font-size: 38px;
      font-weight: 900;

    }

    .big-radar-btn .sub {
      font-size: 19px;
      font-weight: 800;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    .quick-actions-row {
      display: flex;
      gap: 18px;
      margin: 18px 52px 18px;
      flex-shrink: 0;
    }

    .q-btn {
      flex: 1;
      background: #111722;
      border: 2.5px solid #1E2738;
      border-radius: 20px;
      padding: 20px 0;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      color: #94A3B8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .q-btn.active {
      border-color: #FF5500;
      background: rgba(255, 85, 0, 0.14);
      color: #FF8800;
    }

    /* Product Cards */
    .card-item {
      background: #111722;
      border: 2.5px solid #1E2738;
      border-radius: 32px;
      margin: 10px 52px 16px;
      padding: 26px;
      flex-shrink: 0;
    }

    .card-tags {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-visuals {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }

    .v-thumb {
      flex: 1;
      height: 200px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .v-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .v-thumb.amazon {
      background: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .v-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.8);
      color: #FFF;
      font-size: 15px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 8px;
    }

    .card-title {
      font-size: 26px;
      font-weight: 800;
      color: #F8FAFC;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price-txt {
      font-size: 32px;
      font-weight: 900;
      color: #FF5500;
    }

    .cart-add-btn {
      background: #FF5500;
      color: #FFF;
      font-size: 21px;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(255, 85, 0, 0.4);
    }

    /* =========================================================================
       SCREEN 2: TIKTOK LIVESTREAM PAUSED & DETECT
       ========================================================================= */
    .stream-feed {
      position: absolute;
      inset: 0;
      background: #000;
    }

    .stream-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 40% center;
      filter: brightness(0.92);
      transform: scale(1.15);
    }

    .stream-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 22%, transparent 60%, rgba(0,0,0,0.88) 100%);
      pointer-events: none;
    }

    .tiktok-sidebar {
      position: absolute;
      right: 36px;
      bottom: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      z-index: 30;
    }

    .tt-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .tt-icon-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: #FFF;
    }

    .tt-action-txt {
      font-size: 21px;
      font-weight: 800;
      color: #FFF;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    .tt-bottom-info {
      position: absolute;
      bottom: 90px;
      left: 48px;
      z-index: 30;
      max-width: 72%;
    }

    .tt-username {
      font-size: 36px;
      font-weight: 900;
      color: #FFF;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tt-caption {
      font-size: 26px;
      color: #E2E8F0;
      line-height: 1.35;
      font-weight: 600;
    }

    /* StreamSnap AI Notification Drop Banner */
    .streamsnap-notif-banner {
      position: absolute;
      top: 130px;
      left: 40px;
      right: 40px;
      background: rgba(17, 23, 34, 0.95);
      border: 3px solid #FF5500;
      border-radius: 32px;
      padding: 24px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85), 0 0 40px rgba(255,85,0,0.45);
      backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
    }

    .notif-left {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .notif-icon {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: #FF5500;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #FFF;
      box-shadow: 0 4px 20px rgba(255,85,0,0.6);
    }

    .notif-title {
      font-size: 30px;
      font-weight: 900;
      color: #FFF;
    }

    .notif-sub {
      font-size: 21px;
      color: #10B981;
      font-weight: 700;
      margin-top: 3px;
    }

    .notif-view-btn {
      background: #FF5500;
      color: #FFF;
      font-size: 22px;
      font-weight: 800;
      padding: 14px 30px;
      border-radius: 18px;
    }

    .pause-badge-center {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(14px);
      border: 3px solid rgba(255, 85, 0, 0.7);
      padding: 22px 48px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 35;
    }

    .pause-badge-txt {
      font-size: 30px;
      font-weight: 900;
      color: #FF8800;
      letter-spacing: 1.5px;
    }

    .ai-bbox {
      position: absolute;
      top: 36%;
      left: 28%;
      width: 480px;
      height: 500px;
      border: 4px solid #FF5500;
      border-radius: 28px;
      box-shadow: 0 0 40px rgba(255,85,0,0.7);
      z-index: 32;
    }

    .bbox-tag {
      position: absolute;
      top: -40px;
      left: 0;
      background: #FF5500;
      color: #FFF;
      font-size: 21px;
      font-weight: 900;
      padding: 6px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(255,85,0,0.6);

    /* =========================================================================
       SCREEN 4: CART & 1-TAP CHECKOUT
       ========================================================================= */
    .cart-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 52px 30px;
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .cart-head-title {
      font-size: 46px;
      font-weight: 900;
      color: #FFF;
    }

    .cart-head-count {
      font-size: 24px;
      color: #FF5500;
      font-weight: 800;
    }

    .cart-item-card {
      background: #111722;
      border: 2.5px solid #1E2738;
      border-radius: 28px;
      padding: 22px 26px;
      margin-bottom: 16px;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .cart-thumb {
      width: 140px;
      height: 140px;
      border-radius: 20px;
      background: #FFF;

      flex-shrink: 0;
    }

    .cart-info {
      flex: 1;
    }

    .cart-item-name {
      font-size: 26px;
      font-weight: 800;
      color: #FFF;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .cart-item-sub {
      font-size: 19px;
      color: #64748B;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .cart-item-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-price {
      font-size: 32px;
      font-weight: 900;
      color: #FF5500;
    }

    .cart-summary-box {
      margin-top: auto;
      background: #0F1622;
      border: 2.5px solid #1C2536;
      border-radius: 32px;
      padding: 28px 32px;
      margin-bottom: 24px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;

    .summary-row.total {

    .checkout-main-btn {
      background: linear-gradient(135deg, #FF6A00 0%, #FF9900 100%);
      color: #000;
      font-size: 34px;
      font-weight: 900;

      padding: 30px 0;
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(255, 106, 0, 0.45);

    .amazon-guarantee-txt {

      align-items: center;

<body id="body-root">
  <div id="stage-scaler">
    <div class="ambient-glow"></div>
    <div class="grid-lines"></div>

    <!-- Top Editorial Header Zone -->
    <div class="header-zone">
      <div class="badge-pill" id="badge-pill">
        <span>⚡</span>
        <span id="badge-text">STREAMSNAP AI</span>
      </div>
      <h1 class="headline" id="headline-text">
        Real-Time <span class="highlight">AI Live Scan</span>
      </h1>
      <p class="subheadline" id="subheadline-text">
        Continuous 60 FPS background detection turns any video stream into a shoppable catalog.
      </p>
    </div>

    <!-- Phone Container -->
    <div class="phone-container">
      <!-- iOS Status Bar & Dynamic Island -->
      <div class="ios-statusbar">
        <div class="ios-time">9:41</div>
        <div class="dynamic-island">
          <div style="width: 16px; height: 16px; border-radius: 8px; background: #FF5500;"></div>
          <div style="font-size: 15px; font-weight: 800; color: #FFF;">StreamSnap Active</div>
          <div style="width: 14px; height: 14px; border-radius: 7px; background: #10B981;"></div>
        </div>
        <div class="ios-icons">
          <span>5G</span>
          <span>􀛨</span>
        </div>
      </div>

      <!-- Dynamic Screen Content -->
      <div class="screen-content" id="screen-container">
        <!-- Injected dynamically via JS -->
      </div>
    </div>
  </div>

  <script>
    // Templates for each screenshot
    const SCREENS = {
      // 1. LIVE SCAN RADAR
      1: {
        badge: "REAL-TIME AI RADAR",
        headline: 'AI Live Scan <span class="highlight">at 60 FPS</span>',
        subheadline: "Continuous background detection turns streams into an instant shoppable feed.",
        html: `
          <div class="app-header">
            <div class="brand-row">
              <div class="brand-icon">⚡</div>
              <div>
                <div class="brand-name">StreamSnap</div>
                <div class="brand-sub">Auto-Scan Live Video</div>
              </div>
            </div>
            <div class="header-btns">
              <div class="h-btn">🔔</div>
              <div class="h-cart">🛒 2</div>
            </div>
          </div>

          <div class="live-radar-banner">
            <div class="radar-banner-title">
              <div class="pulse-dot"></div>
              <span>STREAMSNAP RADAR ACTIVE</span>
            </div>
            <span style="background:#FF5500; color:#FFF; font-size:18px; font-weight:900; padding:5px 14px; border-radius:10px;">60 FPS</span>
          </div>

          <div class="how-to-card">
            <div class="how-to-head">
              <span>💡</span>
              <span>HOW LIVE SCAN WORKS</span>
            </div>
            <div class="steps-row">
              <div class="step-box">
                <div class="step-ico">📡</div>

    window.setScreenshotMode = function(modeNum, targetW, targetH) {
      const data = SCREENS[modeNum];
      if (!data) return;
      document.getElementById('badge-text').textContent = data.badge;
      document.getElementById('headline-text').innerHTML = data.headline;
      document.getElementById('subheadline-text').textContent = data.subheadline;
      document.getElementById('screen-container').innerHTML = data.html;

      if (targetW && targetH) {
        const scaler = document.getElementById('stage-scaler');
        const scaleX = targetW / 1290;
        const scaleY = targetH / 2796;
        const scale = Math.min(scaleX, scaleY);
        scaler.style.transform = `scale(${scale})`;
      }
    };

    window.setScreenshotMode(1);
