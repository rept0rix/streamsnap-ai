name = "streamsnap-lens"
main = "src/index.js"
compatibility_date = "2026-08-01"

# PUBLIC_BASE_URL must be this Worker's own reachable URL. Google Lens fetches
# the crop from /img/:key, so a wrong value here fails every request.
# After the first `wrangler deploy`, set it to the printed workers.dev URL.
[vars]
PUBLIC_BASE_URL = "https://streamsnap-lens.na0ryank0.workers.dev"

# Leave empty while developing to accept any origin. Once the extension is
# published, set this to its chrome-extension:// origin.
ALLOWED_ORIGINS = ""

# Cached Lens results and rate-limit counters.
[[kv_namespaces]]
binding = "CACHE"
id = "069fbd2ea1174aa3913841f72bc37ed5"

# Temporary crop storage. Objects live for seconds and are deleted after the
# Lens call returns.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "streamsnap-crops"

# Users, usage, catalog and audit log.
[[d1_databases]]
binding = "DB"
database_name = "streamsnap"
database_id = "caa4a66d-0cab-4dd5-9deb-ebf53c6b80da"
migrations_dir = "migrations"

# Secrets are set with `wrangler secret put`, never in this file:
#   BRIGHTDATA_API_KEY
#   BRIGHTDATA_ZONE
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   ADMIN_EMAILS      comma-separated; these accounts become admin on first login

[observability]
enabled = true
