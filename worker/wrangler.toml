name = "streamsnap-lens"
main = "src/index.js"
compatibility_date = "2026-08-01"

# PUBLIC_BASE_URL must be this Worker's own reachable URL. Google Lens fetches
# the crop from /img/:key, so a wrong value here fails every request.
# After the first `wrangler deploy`, set it to the printed workers.dev URL.
[vars]
PUBLIC_BASE_URL = "https://streamsnap-lens.na0ryank0.workers.dev"

# Every origin allowed to (a) receive a session token as an OAuth return target
# and (b) make credentialed cross-origin calls to /auth/me and /auth/logout.
#
# The site MUST be listed here or sign-in fails closed: /auth/start rejects the
# return address, and the browser blocks the credentialed fetch. Exact origins,
# no trailing slash, no wildcards. Add the www host too if the site answers on it.
ALLOWED_ORIGINS = "https://streamsnap.online,https://www.streamsnap.online"

# Oldest extension build allowed to run. The extension polls /version and hard-
# blocks itself with an "update required" screen when its installed version is
# older than this. Bump it to force everyone below onto the new build without a
# code deploy. Must be a bare semver (e.g. "1.6.0").
MIN_EXTENSION_VERSION = "1.6.0"

# Cached Lens results and rate-limit counters.
[[kv_namespaces]]
binding = "CACHE"
id = "069fbd2ea1174aa3913841f72bc37ed5"

# Temporary crop storage. Objects live for seconds and are deleted after the
# Lens call returns.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "streamsnap-crops"

# Users, usage, catalog and audit log.
[[d1_databases]]
binding = "DB"
database_name = "streamsnap"
database_id = "caa4a66d-0cab-4dd5-9deb-ebf53c6b80da"
migrations_dir = "migrations"

# Secrets are set with `wrangler secret put`, never in this file:
#   BRIGHTDATA_API_KEY
#   BRIGHTDATA_ZONE
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   ADMIN_EMAILS      comma-separated; these accounts become admin on first login

[observability]
enabled = true
