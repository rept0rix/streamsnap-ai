name = "streamsnap-lens"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# PUBLIC_BASE_URL must be this Worker's own reachable URL. Google Lens fetches
# the crop from /img/:key, so a wrong value here fails every request.
# After the first `wrangler deploy`, set it to the printed workers.dev URL.
[vars]
PUBLIC_BASE_URL = "https://streamsnap-lens.na0ryank0.workers.dev"

# Every origin allowed to (a) receive a session token as an OAuth return target
# and (b) make credentialed cross-origin calls to /auth/me and /auth/logout.
#
# The site MUST be listed here or sign-in fails closed: /auth/start rejects the
# return address, and the browser blocks the credentialed fetch. Exact origins,
# no trailing slash, no wildcards. Add the www host too if the site answers on it.
ALLOWED_ORIGINS = "https://streamsnap.online,https://www.streamsnap.online"

# Oldest extension build allowed to run. The extension polls /version and hard-
# blocks itself with an "update required" screen when its installed version is
# older than this. Bump it to force everyone below onto the new build without a
# code deploy. Must be a bare semver (e.g. "1.6.0").
MIN_EXTENSION_VERSION = "1.6.0"

# Metering (see src/quota.js). Scans that run on OUR Gemini key are counted;
# scans sent with the caller's own key (X-Gemini-Key) never are.
#   ANON_TRIAL_SCANS  lifetime scans per install before sign-in is required.
#                     Tiny on purpose: the install id is client-minted.
#   FREE_TRIAL_SCANS  lifetime scans after Google sign-in. When they run out the
#                     user buys a scan pack (src/billing.js PACKAGES) or adds a key.
ANON_TRIAL_SCANS = "10"
FREE_TRIAL_SCANS = "100"

# Where 402 responses and the account page send people to buy scans.
PUBLIC_SITE_URL = "https://streamsnap.online"

# Cached Lens results and rate-limit counters.
[[kv_namespaces]]
binding = "CACHE"
id = "069fbd2ea1174aa3913841f72bc37ed5"

# Temporary crop storage. Objects live for seconds and are deleted after the
# Lens call returns.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "streamsnap-crops"

# Users, usage, catalog and audit log.
[[d1_databases]]
binding = "DB"
database_name = "streamsnap"
database_id = "caa4a66d-0cab-4dd5-9deb-ebf53c6b80da"
migrations_dir = "migrations"

# Secrets are set with `wrangler secret put`, never in this file:
#   GEMINI_API_KEY    Gemini 2.5 Flash for frame recognition (same model as the extension);
#                     without it the Worker falls back to Workers AI (Llama), which is
#                     noticeably worse at reading brands/models off a video frame.
#   GEMINI_MODELS     optional comma-separated override, default "gemini-2.5-flash,gemini-flash-latest"
#   BRIGHTDATA_API_KEY
#   BRIGHTDATA_ZONE
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   ADMIN_EMAILS      comma-separated; these accounts become admin on first login
#   STRIPE_SECRET_KEY     enables POST /billing/checkout (Stripe Checkout, one-off scan packs).
#                         Without it checkout answers 503 PURCHASES_DISABLED and packs can
#                         still be granted by hand via POST /api/admin/users/:id/credits.
#   STRIPE_WEBHOOK_SECRET signing secret of the endpoint  <worker>/billing/webhook
#                         (event: checkout.session.completed). Optional but recommended;
#                         the account page also confirms via /billing/confirm on return.
#   SUPPORT_EMAIL         shown to users when purchases are disabled.

[observability]
enabled = true

# Used when Bright Data secrets are not set. Lets /resolve keep working
# for the mobile live scan without a third-party key.
[ai]
binding = "AI"
