<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90" fill="none">
  <defs>
    <linearGradient id="logo_bolt_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="60%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="logo_ring_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8E1" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <linearGradient id="logo_badge_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 153, 0, 0.2)" />
      <stop offset="100%" stop-color="rgba(255, 85, 0, 0.1)" />
    </linearGradient>
    <filter id="logo_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FF9900" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Optical Camera / Laser Shutter Symbol -->
  <g transform="translate(10, 10)">
    <!-- Outer Aperture Ring -->
    <rect x="0" y="0" width="70" height="70" rx="18" fill="#101622" stroke="url(#logo_ring_grad)" stroke-width="2.5" />
    
    <!-- Shutter Crosshairs / Focus Marks -->
    <path d="M 16 26 L 16 16 L 26 16" fill="none" stroke="#00A8E1" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 54 26 L 54 16 L 44 16" fill="none" stroke="#00A8E1" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 16 44 L 16 54 L 26 54" fill="none" stroke="#00A8E1" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 54 44 L 54 54 L 44 54" fill="none" stroke="#00A8E1" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Laser Pulse Circle -->
    <circle cx="35" cy="35" r="18" fill="rgba(0, 168, 225, 0.15)" />

    <!-- Dynamic Lightning Flash -->
    <polygon points="38 15 23 38 34 38 32 55 48 30 36 30" fill="url(#logo_bolt_grad)" filter="url(#logo_glow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(98, 52)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="-0.8">Stream<tspan fill="#FF9900">Snap</tspan></text>
    
    <!-- AI Pill Badge -->
    <g transform="translate(202, -26)">
      <rect width="48" height="24" rx="6" fill="url(#logo_badge_grad)" stroke="rgba(255, 153, 0, 0.45)" stroke-width="1.2" />
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="900" fill="#FF9900" text-anchor="middle" letter-spacing="0.5">AI</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="2" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.2">Live Stream Visual Shopping</text>
  </g>
</svg>
